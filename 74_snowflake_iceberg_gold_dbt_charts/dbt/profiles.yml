iceberg_bi:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ORGANIZATION_NAME', '') }}-{{ env_var('SNOWFLAKE_ACCOUNT_NAME', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      # Terraformと同じservice userとキーペアで接続する
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: CM_KASAMA_ICEBERG_BI_DEPLOY_ROLE
      database: CM_KASAMA_ICEBERG_BI_DB
      warehouse: CM_KASAMA_ICEBERG_BI_DBT_WH
      schema: SEED
      threads: 4
