name: iceberg_bi
version: "1.0.0"
profile: iceberg_bi

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

flags:
  # Do not send dbt usage stats to dbt Labs
  send_anonymous_usage_stats: false

seeds:
  iceberg_bi:
    # Load the CSVs as regular tables. The gold models read them
    +schema: SEED

models:
  iceberg_bi:
    gold:
      +materialized: table
      +schema: GOLD
      +table_format: iceberg
      +external_volume: CM_KASAMA_ICEBERG_BI_GOLD_VOL
